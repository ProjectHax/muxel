[package]
name = "muxel-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Terminal backend (PTY + alacritty_terminal) and GPUI terminal element for muxel."

[dependencies]
gpui.workspace = true

# Terminal emulation (VTE parser + grid) and cross-platform PTY.
alacritty_terminal = "0.25"
portable-pty = "0.9"

parking_lot = "0.12"
async-channel = "2.3"
base64 = "0.22"
libc = "0.2"

muxel-core.workspace = true
anyhow.workspace = true
log.workspace = true
uuid.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_System_IO",
] }

[target.'cfg(unix)'.dependencies]
# The PTY reader waits on the master plus a wake pipe through epoll / kqueue;
# macOS's poll(2) does not support PTY devices.
polling = "3"
