[package]
name = "muxel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core domain types for muxel: projects, agent instances, and the pane layout tree."

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# PowerShell's `-EncodedCommand` takes UTF-16LE base64. Already in the tree via
# muxel-terminal, so this adds a dependency edge, not a new crate.
base64 = "0.22"
# Already resolved for the app/store; decode UUIDv7 rollout dates in local time.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Team libraries (`library`): parse `muxel-library.toml` and strip Unicode format
# characters. Both already in the tree (via muxel-store and rustybuzz), so these
# add dependency edges, not new crates.
toml = "1"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
# "Copy as rich text" (`rich_copy`): the same Markdown parser gpui-component's
# rendered view uses, already in the tree, so this adds an edge, not a crate.
markdown = "1"
# Sanitizes the raw HTML that copy puts on the clipboard. 4.0.x is the line on
# html5ever 0.27, which gpui-component already pulls in (4.1+ moves to 0.31/0.35);
# 4.0.3 carries the backported fixes for RUSTSEC-2025-0071, 2026-0193 and 2026-0213.
ammonia = "~4.0.3"

[dev-dependencies]
serde_json.workspace = true
