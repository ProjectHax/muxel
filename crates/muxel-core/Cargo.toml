[package]
name = "muxel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core domain types for muxel: projects, agent instances, and the pane layout tree."

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# PowerShell's `-EncodedCommand` takes UTF-16LE base64. Already in the tree via
# muxel-terminal, so this adds a dependency edge, not a new crate.
base64 = "0.22"
# Team libraries (`library`): parse `muxel-library.toml` and strip Unicode format
# characters. Both already in the tree (via muxel-store and rustybuzz), so these
# add dependency edges, not new crates.
toml = "1"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

[dev-dependencies]
serde_json.workspace = true
