name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld cmake pkg-config \
            libfontconfig-dev libfreetype6-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libx11-xcb-dev \
            libasound2-dev libvulkan-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # x86_64 + arm64 Linux (native runners), macOS (Apple Silicon), Windows.
        # Intel macOS isn't a separate test runner — it's covered by the release
        # job's x86_64 cross-compile (the code is arch-portable).
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install clippy for Windows
        if: runner.os == 'Windows'
        run: rustup component add clippy
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld cmake pkg-config \
            libfontconfig-dev libfreetype6-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libx11-xcb-dev \
            libasound2-dev libvulkan-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      # `muxel ctl` (outside agents such as Grok Bot driving muxel) runs from
      # contexts with no display: it must start, print its usage, and report —
      # as JSON, exit 1 — that no muxel is running, without touching the GUI.
      - name: muxel ctl starts without a display
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          unset DISPLAY WAYLAND_DISPLAY
          target/debug/muxel ctl help | grep -q '^usage: muxel ctl'
          set +e; out="$(target/debug/muxel ctl projects)"; code=$?; set -e
          test "$code" -eq 1
          echo "$out" | grep -q "muxel isn't running"
      # The .deb's `Depends` is hand-written (see `[package.metadata.deb]`), because
      # cargo-deb's `$auto` resolves against this build host and so pins the
      # pre-`t64` library names, which do not exist on Ubuntu 24.04 or Debian 13.
      # Hand-written means nothing regenerates it when muxel gains a native
      # dependency, so check it here: `dpkg-shlibdeps` is what `$auto` itself uses,
      # and a library it needs that we do not name is a .deb that installs and then
      # fails to start.
      - name: The .deb declares every library the binary needs
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          # dpkg-shlibdeps insists on being run from a source package.
          mkdir -p debian
          printf 'Source: muxel\n\nPackage: muxel\nArchitecture: any\n' > debian/control
          dpkg-shlibdeps -O --ignore-missing-info target/debug/muxel > shlibdeps.txt
          rm -rf debian
          flatten() { tr ',' '\n' | tr '|' '\n' | sed 's/(.*//' | tr -d ' ' | grep -v '^$' | sort -u; }
          needed=$(sed 's/^shlibs:Depends=//' shlibdeps.txt | flatten)
          # Every alternative we declare counts as naming that package.
          declared=$(sed -n 's/^depends = "\(.*\)"$/\1/p' crates/muxel/Cargo.toml | flatten)
          if [ -z "$declared" ]; then
            echo "::error::could not read the .deb Depends from crates/muxel/Cargo.toml"
            exit 1
          fi
          # Guaranteed by another dependency, so cargo-deb omits them and so do we.
          implied="libgcc-s1"
          missing=""
          for pkg in $needed; do
            if grep -qxF "$pkg" <<<"$declared" || grep -qxF "$pkg" <<<"$implied"; then
              echo "  ok       $pkg"
            else
              echo "  MISSING  $pkg"
              missing="$missing $pkg"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::the .deb Depends in crates/muxel/Cargo.toml does not name:$missing"
            echo "Add it there, with a t64 alternative if that library was renamed."
            exit 1
          fi
          echo "Every library the binary needs is named in the .deb Depends."

      - name: Clippy (Windows-only code)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
