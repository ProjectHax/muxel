[workspace]
resolver = "2"
members = ["crates/muxel", "crates/muxel-core", "crates/muxel-store", "crates/muxel-terminal", "crates/muxel-tray"]

[workspace.package]
version = "0.1.9"
edition = "2024"
license = "GPL-3.0-only"
authors = ["ProjectHax LLC"]
repository = "https://github.com/projecthax/muxel"

[workspace.dependencies]
# --- GPUI (Zed's UI framework) ---
# Keep the direct dependencies on the same unqualified Git source used by
# gpui-component so Cargo resolves one GPUI type family. Cargo.lock pins that
# shared source to cc053a4a, gpui-component's tested Zed revision.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
] }

# --- UI component library (Longbridge) ---
# Pinned to the merged accessibility and link-handler changes verified locally.
# `tree-sitter-languages` enables all bundled syntax-highlighting grammars for
# the code-editor panes (InputState::code_editor).
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "3cb3cc139619ce704387b69deb17822b0fc22497", features = [
    "tree-sitter-languages",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "3cb3cc139619ce704387b69deb17822b0fc22497", package = "gpui-component-assets" }

# --- workspace-internal crates (added in later phases) ---
muxel-core = { path = "crates/muxel-core" }
muxel-terminal = { path = "crates/muxel-terminal" }
muxel-store = { path = "crates/muxel-store" }
muxel-tray = { path = "crates/muxel-tray" }

# --- shared third-party deps ---
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Muxel is an interactive GUI even in local builds. Plain Cargo dev mode leaves
# GPUI/Taffy primitive arithmetic and layout helpers uninlined; sustained
# terminal output can then spend an entire core recomputing layout. Keep local
# crates cheap to compile while optimizing third-party layout/rendering code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
